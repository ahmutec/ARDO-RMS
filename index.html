<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARDO Rent Management</title>
    <style>
        :root {
            --g: #1b7f4b;
            --g2: #0f5c35;
            --l: #e8f5ee;
            --w: #fff;
            --t: #17342a;
            --r: #c0392b;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Segoe UI, Nyala, sans-serif;
            background: linear-gradient(135deg, #e8f5ee, #fff);
            color: var(--t);
        }
        #login {
            width: min(96vw, 460px);
            margin: 6vh auto;
            background: var(--w);
            padding: 26px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #1b7f4b33;
            border-top: 6px solid var(--g);
        }
        h1, h2 {
            color: var(--g2);
            margin: 0 0 12px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #b9dcc8;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background: var(--g);
            color: #fff;
            border: 0;
            cursor: pointer;
            font-weight: 600;
        }
        button {
            transition: all .2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #0f5c35, #2ecc71);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px #1b7f4b66;
        }
        button:active {
            transform: translateY(0);
            box-shadow: none;
        }
        button.d {
            background: var(--r);
        }
        button.s {
            width: auto;
            padding: 5px 10px;
            margin: 1px;
        }
        header {
            background: var(--g);
            color: #fff;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        header button {
            width: auto;
            background: #fff;
            color: var(--g2);
        }
        nav {
            display: flex;
            gap: 6px;
            padding: 10px;
            overflow-x: auto;
            background: var(--l);
        }
        nav button {
            width: auto;
            white-space: nowrap;
            background: var(--w);
            color: var(--g2);
            border: 1px solid var(--g);
        }
        nav button.on {
            background: var(--g);
            color: #fff;
        }
        main {
            padding: 14px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .card {
            background: var(--w);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 10px #1b7f4b22;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }
        .wrap {
            overflow-x: auto;
            margin-top: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        th {
            background: var(--g);
            color: #fff;
        }
        th.fl {
            background: var(--l);
            padding: 3px;
        }
        th.fl select {
            margin: 0;
            padding: 3px;
            font-size: 12px;
            min-width: 70px;
        }
        th, td {
            padding: 7px;
            border-bottom: 1px solid #d5eadd;
            text-align: left;
            white-space: nowrap;
        }
        tfoot td {
            font-weight: 700;
            background: var(--l);
        }
        .kpi {
            background: var(--l);
            border-left: 5px solid var(--g);
            padding: 10px;
            border-radius: 8px;
        }
        .kpi b {
            font-size: 18px;
            display: block;
        }
        .bad {
            color: var(--r);
            font-weight: 700;
        }
        .hide {
            display: none;
        }
        label {
            font-size: 12px;
            color: #456;
        }
        .xbtn {
            width: auto;
            background: #fff;
            color: var(--g2);
            border: 1px solid var(--g);
            padding: 4px 10px;
        }
        .brand {
            text-align: center;
            margin-bottom: 12px;
        }
        .brand img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            display: block;
            margin: 0 auto 6px;
        }
        .brand h1 {
            font-size: 30px;
            letter-spacing: 4px;
            margin: 0;
        }
        .brand p {
            margin: 2px 0 0;
            color: #5b7a6a;
        }
        .hb {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hb img {
            height: 38px;
            width: 38px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            padding: 2px;
        }
        .lk {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        button.bl {
            flex: 1;
            width: auto;
            background: #d6ebff;
            color: #0b4f8a;
            border: 1px solid #a9d1f7;
            padding: 10px 6px;
            font-size: 13px;
        }
        button.bl:hover {
            background: linear-gradient(135deg, #2d8fe5, #6cc3ff);
            color: #fff;
            box-shadow: 0 6px 14px #2d8fe566;
        }
        nav button:hover {
            color: #fff;
        }
        button.xbtn:hover {
            color: #fff;
        }

        @media(min-width:1024px) {
            body {
                font-size: 15px;
            }
            #login {
                width: 540px;
                margin: 8vh auto;
            }
            .brand img {
                width: 120px;
                height: 120px;
            }
            table {
                font-size: 14px;
            }
            header {
                padding: 12px 32px;
            }
            nav {
                padding: 12px 32px;
            }
            main {
                padding: 22px 32px;
            }
            .card {
                padding: 20px;
            }
        }

        @media(max-width:600px) {
            main {
                padding: 8px;
            }
            .card {
                padding: 10px;
                border-radius: 10px;
            }
            h2 {
                font-size: 18px;
            }
            header {
                padding: 8px 10px;
                gap: 6px;
            }
            header span#who {
                font-size: 12px;
            }
            input, select {
                font-size: 16px;
            }
            table {
                font-size: 12px;
            }
            th, td {
                padding: 5px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            nav {
                padding: 8px 6px;
            }
            nav button {
                padding: 8px 10px;
            }
            #login {
                padding: 22px 16px;
            }
        }

        @media(max-width:360px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .ld {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--g2);
            margin: 4px 0;
        }
        .sp {
            width: 16px;
            height: 16px;
            border: 3px solid #cfe8da;
            border-top-color: var(--g);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none!important;
            box-shadow: none!important;
        }
        header .ld {
            color: #fff;
        }
        header .sp {
            border-color: #ffffff55;
            border-top-color: #fff;
        }

        @media print {
            header, nav, button, .fl {
                display: none!important;
            }
        }

    </style>
</head>

<body>
    <!-- ===== Login screen ===== -->
    <div id="login">
        <div class="brand">
            <img class="lg-img" alt="ARDO logo">
            <h1>ARDO</h1>
            <p>Rent Management System</p>
        </div>
        <div id="lg">
            <input id="u" placeholder="Username or Code">
            <input id="p" type="password" placeholder="Password" onkeydown="event.key=='Enter'&&doLogin()">
            <button onclick="doLogin()">Login</button>
            <p id="lm" class="bad"></p>
            <div class="lk">
                <button class="bl" onclick="lpCreate()">Create account</button>
                <button class="bl" onclick="lpForgot()">Forgot password</button>
            </div>
        </div>
        <div id="lp"></div>
    </div>

    <!-- ===== Main app ===== -->
    <div id="app" class="hide">
        <header>
            <span class="hb">
                <img class="lg-img" alt="ARDO">
                <b>ARDO Rent Management</b>
            </span>
            <span id="who"></span>
            <button onclick="doLogout()">Logout</button>
        </header>
        <nav id="nav"></nav>
        <main id="main"></main>
    </div>

    const EM = ['Meskerem', 'Tikimt', 'Hidar', 'Tahsas', 'Tir', 'Yekatit', 'Megabit', 'Miazia', 'Ginbot', 'Sene', 'Hamle', 'Nehase', 'Pagume'];
    const iso = d => d.toISOString().slice(0, 10);
    const todayISO = () => iso(new Date());
    const pad = n => String(n).padStart(2, '0');
    const addDays = (i, n) => iso(new Date(Date.parse(i) + n * 864e5));
    const gcJDN = i => {
        const [y, m, d] = i.split('-').map(Number);
        return Math.floor(Date.UTC(y, m - 1, d) / 864e5) + 2440588;
    };
    function gcToEc(i) {
        const j = gcJDN(i) - 1723856;
        const r = ((j % 1461) + 1461) % 1461;
        const n = (r % 365) + 365 * Math.floor(r / 1460);
        return [4 * Math.floor(j / 1461) + Math.floor(r / 365) - Math.floor(r / 1460), Math.floor(n / 30) + 1, (n % 30) + 1];
    }
    function ecToGc(y, m, d) {
        const j = 1723856 + 365 + 365 * (y - 1) + Math.floor(y / 4) + 30 * m + d - 31;
        return iso(new Date((j - 2440588) * 864e5));
    }
    const parts = i => EC() ? gcToEc(i) : i.split('-').map(Number);
    const mdiff = (a, b) => {
        const p = parts(a);
        const q = parts(b);
        return (q[0] - p[0]) * MPY() + q[1] - p[1] + (q[2] >= p[2] ? 1 : 0);
    };
    const dt = i => {
        if (!i) {
            return '';
        }
        if (!EC()) {
            return i;
        }
        const p = gcToEc(i);
        return `${p[2]} ${EM[p[1] - 1]} ${p[0]}`;
    };

    function debtOf(t) {
        const today = todayISO();
        const end = t.endDate && t.endDate < today ? t.endDate : today;
        const st = t.startDate || today;
        const elapsed = Math.max(0, mdiff(st, end));
        const owedM = Math.max(0, elapsed - paidMonths(t.id));
        const prev = Math.max(0, N(t.debtMonths) * N(t.monthly) - N(t.debtPaid));

        const penPaid = ps.reduce((a, p) => a + N(p.penaltyPaid), 0);
        return { owedM, owedAmt: owedM * N(t.monthly), prev, pen, penPaid, penLeft: Math.max(0, pen - penPaid), total: owedM * N(t.monthly) + prev };
    }

    // ---- Report (quarterly) ----
    function vReport() {
        const C = S('calendar') || 'GC';

            F.yc = C;
            const tp = parts(todayISO());
            F.y = tp[0];
            F.q = Math.floor((tp[1] - 1) / 3) + 1;
        }
        const m0 = (F.q - 1) * 3 + 1;
        let aI;
        let bI;
        if (EC()) {
            aI = ecToGc(F.y, m0, 1);
            bI = addDays(F.q == 4 ? ecToGc(F.y + 1, 1, 1) : ecToGc(F.y, m0 + 3, 1), -1);
        } else {
            aI = `${F.y}-${pad(m0)}-01`;
            bI = iso(new Date(Date.UTC(F.y, m0 + 2, 0)));
        }
        const data = D.Tenants.map(t => {
            const ps = D.Payments.filter(p => p.tenantId == t.id && p.status == 'Paid' && p.date >= aI && p.date <= bI);
            const pm = ps.reduce((s, p) => s + N(p.months), 0);
            const paid = ps.reduce((s, p) => s + N(p.total), 0);
            const um = Math.max(0, 3 - pm);
            return { name: t.name, gender: t.gender, contract: t.contract, pm, paid: fmt(paid), um, unpaid: fmt(um * N(t.monthly)), _p: paid, _u: um * N(t.monthly) };

    function vSet() {
        return `<div class="card"><h2>Penalty Settings</h2><div class="grid">${field('s_c', 'Calendar', S('calendar') || 'GC', '', ['GC', 'EC'])}${field('s_t', 'Penalty Type', S('penaltyType'), '', ['percent', 'fixed'])}${field('s_v', 'Value (% or number)', S('penaltyValue'), 'number')}${field('s_g', 'Grace days', S('graceDays'), 'number')}</div>
      <p>Calendar: GC = Gregorian · EC = Ethiopian (only the dates change)</p><p>percent: total × % × days late &nbsp;|&nbsp; fixed: one-time fixed amount</p><button onclick="sSave()">Save</button></div>`;
    }
    async function sSave() {
        await run('saveRow', T, 'Settings', { key: 'calendar', value: val('s_c') });
        await run('saveRow', T, 'Settings', { key: 'penaltyType', value: val('s_t') });
        await run('saveRow', T, 'Settings', { key: 'penaltyValue', value: val('s_v') });
        await run('saveRow', T, 'Settings', { key: 'graceDays', value: val('s_g') });
        load();
    }

    </script>
</body>

</html>
