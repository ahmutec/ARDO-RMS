<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARDO Rent Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- ===== Login screen ===== -->
    <div id="login">
        <div class="brand">
            <img class="lg-img" alt="ARDO logo">
            <h1>ARDO</h1>
            <p>Rent Management System</p>
        </div>
        <div id="lg">
            <input id="u" placeholder="Username or Code">
            <input id="p" type="password" placeholder="Password" onkeydown="event.key=='Enter'&&doLogin()">
            <button onclick="doLogin()">Login</button>
            <p id="lm" class="bad"></p>
            <div class="lk">
                <button class="bl" onclick="lpCreate()">Create account</button>
                <button class="bl" onclick="lpForgot()">Forgot password</button>
            </div>
        </div>
        <div id="lp"></div>
    </div>

    <!-- ===== Main app ===== -->
    <div id="app" class="hide">
        <header>
            <span class="hb">
                <img class="lg-img" alt="ARDO">
                <b>ARDO Rent Management</b>
            </span>
            <span id="who"></span>
            <button onclick="doLogout()">Logout</button>
        </header>
        <nav id="nav"></nav>
        <main id="main"></main>
    </div>

    <script src="script.js"></script>
</body>

</html>
