<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARDO Rent Management System</title>
    <style>
        :root {
            --g: #1b7f4b;
            --g2: #0f5c35;
            --l: #e8f5ee;
            --w: #fff;
            --t: #17342a;
            --r: #c0392b;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: Segoe UI, Nyala, sans-serif;
            background: linear-gradient(135deg, #e8f5ee, #fff);
            color: var(--t);
        }
        #login {
            width: min(96vw, 460px);
            margin: 6vh auto;
            background: var(--w);
            padding: 26px 22px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #1b7f4b33;
            border-top: 6px solid var(--g);
        }
        h1, h2 {
            color: var(--g2);
            margin: 0 0 12px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #b9dcc8;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            background: var(--g);
            color: #fff;
            border: 0;
            cursor: pointer;
            font-weight: 600;
        }
        button {
            transition: all .2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #0f5c35, #2ecc71);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px #1b7f4b66;
        }
        button:active {
            transform: translateY(0);
            box-shadow: none;
        }
        button.d {
            background: var(--r);
        }
        button.s {
            width: auto;
            padding: 5px 10px;
            margin: 1px;
        }
        header {
            background: var(--g);
            color: #fff;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        header button {
            width: auto;
            background: #fff;
            color: var(--g2);
        }
        nav {
            display: flex;
            gap: 6px;
            padding: 10px;
            overflow-x: auto;
            background: var(--l);
        }
        nav button {
            width: auto;
            white-space: nowrap;
            background: var(--w);
            color: var(--g2);
            border: 1px solid var(--g);
        }
        nav button.on {
            background: var(--g);
            color: #fff;
        }
        main {
            padding: 14px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .card {
            background: var(--w);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 10px #1b7f4b22;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px;
        }
        .wrap {
            overflow-x: auto;
            margin-top: 8px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        th {
            background: var(--g);
            color: #fff;
        }
        th.fl {
            background: var(--l);
            padding: 3px;
        }
        th.fl select {
            margin: 0;
            padding: 3px;
            font-size: 12px;
            min-width: 70px;
        }
        th, td {
            padding: 7px;
            border-bottom: 1px solid #d5eadd;
            text-align: left;
            white-space: nowrap;
        }
        tfoot td {
            font-weight: 700;
            background: var(--l);
        }
        .kpi {
            background: var(--l);
            border-left: 5px solid var(--g);
            padding: 10px;
            border-radius: 8px;
        }
        .kpi b {
            font-size: 18px;
            display: block;
        }
        .bad {
            color: var(--r);
            font-weight: 700;
        }
        .hide {
            display: none;
        }
        label {
            font-size: 12px;
            color: #456;
        }
        .xbtn {
            width: auto;
            background: #fff;
            color: var(--g2);
            border: 1px solid var(--g);
            padding: 4px 10px;
        }
        .brand {
            text-align: center;
            margin-bottom: 12px;
        }
        .brand img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            display: block;
            margin: 0 auto 6px;
        }
        .brand h1 {
            font-size: 30px;
            letter-spacing: 4px;
            margin: 0;
        }
        .brand p {
            margin: 2px 0 0;
            color: #5b7a6a;
        }
        .hb {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hb img {
            height: 38px;
            width: 38px;
            object-fit: contain;
            background: #fff;
            border-radius: 8px;
            padding: 2px;
        }
        .lk {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        button.bl {
            flex: 1;
            width: auto;
            background: #d6ebff;
            color: #0b4f8a;
            border: 1px solid #a9d1f7;
            padding: 10px 6px;
            font-size: 13px;
        }
        button.bl:hover {
            background: linear-gradient(135deg, #2d8fe5, #6cc3ff);
            color: #fff;
            box-shadow: 0 6px 14px #2d8fe566;
        }
        nav button:hover {
            color: #fff;
        }
        button.xbtn:hover {
            color: #fff;
        }

        @media(min-width:1024px) {
            body {
                font-size: 15px;
            }
            #login {
                width: 540px;
                margin: 8vh auto;
            }
            .brand img {
                width: 120px;
                height: 120px;
            }
            table {
                font-size: 14px;
            }
            header {
                padding: 12px 32px;
            }
            nav {
                padding: 12px 32px;
            }
            main {
                padding: 22px 32px;
            }
            .card {
                padding: 20px;
            }
        }

        @media(max-width:600px) {
            main {
                padding: 8px;
            }
            .card {
                padding: 10px;
                border-radius: 10px;
            }
            h2 {
                font-size: 18px;
            }
            header {
                padding: 8px 10px;
                gap: 6px;
            }
            header span#who {
                font-size: 12px;
            }
            input, select {
                font-size: 16px;
            }
            table {
                font-size: 12px;
            }
            th, td {
                padding: 5px;
            }
            .grid {
                grid-template-columns: 1fr 1fr;
            }
            nav {
                padding: 8px 6px;
            }
            nav button {
                padding: 8px 10px;
            }
            #login {
                padding: 22px 16px;
            }
        }

        @media(max-width:360px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .ld {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--g2);
            margin: 4px 0;
        }
        .sp {
            width: 16px;
            height: 16px;
            border: 3px solid #cfe8da;
            border-top-color: var(--g);
            border-radius: 50%;
            animation: spin .7s linear infinite;
            flex: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        button:disabled {
            opacity: .65;
            cursor: wait;
            transform: none!important;
            box-shadow: none!important;
        }
        header .ld {
            color: #fff;
        }
        header .sp {
            border-color: #ffffff55;
            border-top-color: #fff;
        }

        @media print {
            header, nav, button, .fl {
                display: none!important;
            }
        }


        nav.sub { background: transparent; padding: 0 0 12px; }
        nav.sub button { border-radius: 20px; padding: 8px 16px; }
        .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .bar h2 { margin: 0; }
        button.pbtn { width: auto; padding: 8px 16px; margin: 0; }
        .ph { display: none; }
        .form h2 { font-size: 22px; margin-bottom: 4px; }
        .sec { color: var(--g2); font-size: 15px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--l); }
        .fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; }
        .fg > div > label { display: block; font-weight: 600; font-size: 13px; color: var(--g2); margin-bottom: 4px; }
        .form input, .form select { margin: 0; padding: 11px 12px; background: #fafdfb; border: 1.5px solid #b9dcc8; border-radius: 10px; transition: border-color .2s, box-shadow .2s; }
        .form input:focus, .form select:focus { outline: 0; background: #fff; border-color: var(--g); box-shadow: 0 0 0 3px #1b7f4b26; }
        .form input[readonly] { background: var(--l); color: var(--g2); font-weight: 700; }
        .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .actions button { width: auto; min-width: 150px; padding: 11px 22px; }
        .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
        .chip input, .perm input { display: none; }
        .chip span { display: inline-block; padding: 8px 16px; border: 1.5px solid var(--g); border-radius: 20px; font-size: 13px; color: var(--g2); background: #fff; cursor: pointer; user-select: none; transition: all .15s; }
        .chip input:checked + span { background: var(--g); color: #fff; box-shadow: 0 3px 8px #1b7f4b44; }
        .msum { font-size: 13px; color: var(--g2); background: var(--l); padding: 8px 12px; border-radius: 8px; margin: 6px 0 12px; }
        .perms { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
        .pbox { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; padding: 16px 10px; background: #fff; border: 2px solid #cfe8da; border-radius: 14px; cursor: pointer; transition: all .2s; }
        .pbox i { font-style: normal; font-size: 28px; }
        .pbox small { color: #5b7a6a; font-size: 11px; }
        .pbox::after { content: 'Not allowed'; font-size: 11px; color: #9ab; }
        .perm input:checked + .pbox { background: linear-gradient(135deg, #e8f5ee, #d3f0e0); border-color: var(--g); box-shadow: 0 6px 14px #1b7f4b33; transform: translateY(-2px); }
        .perm input:checked + .pbox::after { content: '✔ Allowed'; color: var(--g); font-weight: 700; }
        .rchip { display: inline-flex; align-items: center; padding: 7px 14px; background: var(--l); border: 1.5px solid var(--g); border-radius: 20px; color: var(--g2); font-weight: 600; font-size: 13px; }
        .rchip a { margin-left: 8px; color: var(--r); font-weight: 700; cursor: pointer; }
        .hint { font-size: 12px; color: #5b7a6a; }
        .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 9; padding: 10px 22px; background: var(--g2); color: #fff; border-radius: 22px; box-shadow: 0 6px 16px #0006; }
        @media print {
            .ph { display: block; margin-bottom: 8px; }
            .act, .bar button { display: none !important; }
        }
        nav, nav.sub { flex-wrap: wrap; justify-content: center; overflow-x: visible; }
        .bar { flex-direction: column; justify-content: center; text-align: center; margin-bottom: 8px; }
        .actions, .lk { justify-content: center; }
        td.act { text-align: center; }
        .center { text-align: center; }
        .lang-sw { display: inline-flex; gap: 4px; }
        .lang-sw button { width: auto; margin: 0; padding: 4px 10px; font-size: 12px; background: #fff; color: var(--g2); border: 1px solid var(--g); }
        .lang-sw button.on { background: var(--g); color: #fff; }
        header .lang-sw button.on { background: var(--g2); border-color: #fff; }
        #login > .lang-sw { display: flex; justify-content: flex-end; margin-bottom: 4px; }
        table.sum { max-width: 760px; margin: 0 auto; }
        table.sum td, table.sum th { text-align: center; }
        table.sum tr.tot td { font-weight: 700; background: var(--l); }
        .perm-table { max-width: 640px; margin: 8px auto; }
        .perm-table th, .perm-table td { text-align: center; }
        .perm-table td.ptab { text-align: left; font-weight: 700; }
        .perm-table td.psub { padding-left: 28px; font-weight: 400; }
        .perm-table input { width: 20px; height: 20px; margin: 0; accent-color: var(--g); }
        .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin: 8px 0 18px; }
        .hb-row { display: flex; align-items: flex-start; gap: 10px; margin: 10px 0; }
        .hb-l { width: 110px; flex: none; text-align: right; font-weight: 600; font-size: 13px; color: var(--g2); padding-top: 1px; }
        .hb-bars { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .hb-line { display: flex; align-items: center; gap: 6px; }
        .hb-bar { height: 16px; border-radius: 4px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        .hb-v { font-size: 12px; font-weight: 700; }
        .legend { display: flex; gap: 16px; justify-content: center; font-size: 13px; margin-bottom: 4px; }
        .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    </style>
</head>

<body>
    <!-- ===== Login screen ===== -->
    <div id="login">
        <div class="lang-sw"></div>
        <div class="brand">
            <img class="lg-img" alt="ARDO logo">
            <h1>ARDO</h1>
            <p data-t="Rent Management System">Rent Management System</p>
        </div>
        <div id="lg">
            <input id="u" placeholder="Username or Code" data-p="Username or Code">
            <input id="p" type="password" placeholder="Password" data-p="Password" onkeydown="event.key=='Enter'&&doLogin()">
            <button onclick="doLogin()" data-t="Login">Login</button>
            <p id="lm" class="bad"></p>
            <div class="lk">
                <button class="bl" onclick="lpCreate()" data-t="Create account">Create account</button>
                <button class="bl" onclick="lpForgot()" data-t="Forgot password">Forgot password</button>
            </div>
        </div>
        <div id="lp"></div>
    </div>

    <!-- ===== Main app ===== -->
    <div id="app" class="hide">
        <header>
            <span class="hb">
                <img class="lg-img" alt="ARDO">
                <b data-t="ARDO Rent Management System">ARDO Rent Management System</b>
            </span>
            <span class="lang-sw"></span>
            <span id="who"></span>
            <button onclick="doLogout()" data-t="Logout">Logout</button>
        </header>
        <nav id="nav"></nav>
        <main id="main"></main>
    </div>

    const SUBS = {
        tenants: [['reg', 'Register Tenant'], ['list', 'Tenants List'], ['preg', 'Register Payment'], ['plist', 'Payments List'], ['debt', 'Debts']],
        users: [['reg', 'Register User'], ['list', 'Users List']]
    };
    const VIEWS = {
        tenants: { reg: vTenantForm, list: vTenantList, preg: vPayForm, plist: vPayList, debt: vDebt },
        users: { reg: vUserForm, list: vUserList },
        report: { main: vReport },
        set: { main: vSet }
    };
    const clearEdit = () => { EDIT.t = EDIT.p = EDIT.u = null; };
    const noAccess = () => `<div class="card center">${L('You have no access. Please contact the Super Admin.')}</div>`;
    function render() {
        const tabs = [];
        if (pm('tenants', 'view')) tabs.push(['tenants', 'Tenants']);
        if (SA()) tabs.push(['users', 'Users']);
        if (pm('report', 'view')) tabs.push(['report', 'Report']);
        if (SA()) tabs.push(['set', 'Settings']);
        $('nav').innerHTML = tabs.map(t => `<button class="${t[0] == tab ? 'on' : ''}" onclick="tab='${t[0]}';clearEdit();render()">${L(t[1])}</button>`).join('');
        if (!tabs.length) { $('main').innerHTML = noAccess(); return; }
        if (!tabs.some(t => t[0] == tab)) tab = tabs[0][0];
        const subs = (SUBS[tab] || []).filter(s => tab == 'users' || pm(s[0], 'view') || (EDIT.t && s[0] == 'reg') || (EDIT.p && s[0] == 'preg'));
        if (SUBS[tab] && !subs.length) { $('main').innerHTML = noAccess(); return; }
        if (subs.length && !subs.some(s => s[0] == SUB[tab])) SUB[tab] = subs[0][0];
        const sub = subs.length
            ? `<nav class="sub">${subs.map(s => `<button class="${s[0] == SUB[tab] ? 'on' : ''}" onclick="clearEdit();SUB.${tab}='${s[0]}';render()">${L(s[1])}</button>`).join('')}</nav>`
            : '';
        $('main').innerHTML = sub + VIEWS[tab][SUB[tab] || 'main']();
        if (tab == 'tenants' && SUB.tenants == 'preg' && !EDIT.p) pCalc();
    }
    function editRec(k, id) {
        clearEdit();
        EDIT[k] = id;
        if (k == 'u') SUB.users = 'reg';
        else SUB.tenants = k == 't' ? 'reg' : 'preg';
        render();
    }
    const btns = (k, id) => (canE(k) ? `<button class="s" onclick="editRec('${k}','${id}')">${L('Edit')}</button>` : '') + (canD(k) ? `<button class="s d" onclick="rm('${k}','${id}')">${L('Del')}</button>` : '');
    function toast(m) {
        const d = document.createElement('div');
        d.className = 'toast';
        d.textContent = L(m);
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 2200);
    }
    const phead = t => `<div class="ph"><b>${L('ARDO Rent Management System')}</b> — ${t} — ${dt(todayISO())}</div>`;
    const bar = t => `<div class="bar"><h2>${L(t)}</h2><button class="pbtn" onclick="window.print()">🖨 ${L('Print')}</button></div>${phead(L(t))}`;
    const actions = (save, cancel, ok = true) => ok
        ? `<div class="actions"><button onclick="${save}">${L('Submit')}</button>${cancel ? `<button class="xbtn" onclick="${cancel}">${L('Cancel')}</button>` : ''}</div>`
        : `<p class="hint center">${L('View only')}</p>`;
    function field(id, l, v = '', type = 'text', opts, ro, ph = '') {
        const ctl = opts
            ? `<select id="${id}">${opts.map(o => `<option value="${esc(o)}" ${o == v ? 'selected' : ''}>${esc(L(o))}</option>`).join('')}</select>`
            : `<input id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(L(ph))}" ${ro ? 'readonly' : ''}>`;
        return `<div class="fld"><label>${L(l)}</label>${ctl}</div>`;
    }

    // ---- Months (selectable chips) ----
    const mnames = () => EC() ? ems() : gms();
    const mkey = (y, m) => `${EC() ? 'E' : 'G'}:${y}-${pad(m)}`;
    const mlabel = e => {
        const [t, ym] = e.split(':');
        const [y, m] = ym.split('-');
        return (t == 'E' ? ems() : gms())[m - 1] + ' ' + y;
    };
    // month entry -> [year, month] in the calendar currently in use
    const mp = e => {
        const [t, ym] = e.split(':');
        const [y, m] = ym.split('-').map(Number);
        if (t == (EC() ? 'E' : 'G')) return [y, m];
        return t == 'E' ? ecToGc(y, m, 1).split('-').slice(0, 2).map(Number) : gcToEc(`${y}-${pad(m)}-01`).slice(0, 2);
    };
    const MSEL = new Set();
    let MY = 0;
    const msum = () => MSEL.size ? [...MSEL].sort().map(mlabel).join(', ') + ' (' + MSEL.size + ')' : L('No month selected');
    function monthChips() {
        return mnames().map((n, i) => {
            const k = mkey(MY, i + 1);
            return `<label class="chip"><input type="checkbox" ${MSEL.has(k) ? 'checked' : ''} onchange="toggleM('${k}',this.checked)"><span>${n}</span></label>`;
        }).join('');
    }
    function toggleM(k, on) {
        if (on) MSEL.add(k);
        else MSEL.delete(k);
        $('m_sum').textContent = msum();
        pCalc();
    }
    function setMY(v) {
        MY = +v;
        $('m_chips').innerHTML = monthChips();
    }

    // ---- Tenants: register ----
    function vTenantForm() {
        const t = D.Tenants.find(x => x.id == EDIT.t) || {};
        return `
            <div class="card form">
                <h2>${L(t.id ? 'Edit Tenant' : 'Register Tenant')}</h2>
                <h3 class="sec">${L('Personal Information')}</h3>
                <div class="fg">
                    ${field('f_name', 'Full Name', t.name, 'text', null, 0, 'e.g. Abebe Kebede')}
                    ${field('f_gender', 'Gender', t.gender, '', GEN)}
                    ${field('f_phone', 'Phone', t.phone, 'tel', null, 0, '09...')}
                </div>
                <h3 class="sec">${L('Rent Details')}</h3>
                <div class="fg" oninput="tCalc()">
                    ${field('f_reason', 'Reason for Renting', t.reason, 'text', null, 0, 'Shop, office, ...')}
                    ${field('f_contract', 'Agreement', t.contract, '', CON)}
                    ${field('f_area', 'Area (m²)', t.area, 'number')}
                    ${field('f_pps', 'Price per m²', t.pricePerSqm, 'number')}
                    ${field('f_monthly', 'Monthly Rent (auto)', t.monthly, 'number', null, 1)}
                    ${dfield('f_start', L('Rent Start Date'), t.startDate)}
                    ${dfield('f_end', L('Contract End Date'), t.endDate)}
                </div>
                <h3 class="sec">${L('Previous Debt')}</h3>
                <div class="fg">
                    ${field('f_dm', 'Previous Debt (months)', t.debtMonths || 0, 'number')}
                    ${field('f_dp', 'Previous Debt Paid', t.debtPaid || 0, 'number')}
                </div>
                ${actions(`tSave('${t.id || ''}')`, t.id ? "clearEdit();SUB.tenants='list';render()" : '', t.id ? canE('t') : canA('t'))}
            </div>`;
    }
    const tCalc = () => { $('f_monthly').value = N(val('f_area')) * N(val('f_pps')); };
    async function tSave(id) {
        const o = {
            id, name: val('f_name'), gender: val('f_gender'), phone: val('f_phone'), reason: val('f_reason'),
            area: val('f_area'), pricePerSqm: val('f_pps'), monthly: N(val('f_area')) * N(val('f_pps')),
            startDate: dval('f_start'), endDate: dval('f_end'), contract: val('f_contract'), debtMonths: val('f_dm'), debtPaid: val('f_dp')
        };
        if (!o.name) return alert(L('Enter a name'));
        await run('saveRow', T, 'Tenants', o);
        clearEdit();
        if (id) SUB.tenants = 'list';
        else toast('Tenant registered');
        load();
    }

    // ---- Tenants: list ----
    function vTenantList() {
        const cols = [['name', 'Name'], ['gender', 'Gender', '', GEN], ['phone', 'Phone'], ['reason', 'Reason'], ['area', 'Area (m²)'], ['pricePerSqm', 'Price/m²'], ['monthly', 'Monthly Rent'], ['startDate', 'Rent Start'], ['endDate', 'Rent End'], ['contract', 'Agreement', '', CON], ['debtMonths', 'Prev. Debt Months'], ['debtPaid', 'Prev. Debt Paid']];
        const data = D.Tenants.map(t => ({ ...t, monthly: fmt(t.monthly), startDate: dt(t.startDate), endDate: dt(t.endDate) }));
        const act = canE('t') || canD('t') ? r => btns('t', r.id) : null;
        return `<div class="card">${bar('Tenants List')}${tbl('tenants', cols, data, act)}</div>`;
    }

    // ---- Payments: register ----
    function vPayForm() {
        const p = D.Payments.find(x => x.id == EDIT.p) || {};
        MSEL.clear();
        (p.monthList || '').split(',').filter(Boolean).forEach(k => MSEL.add(k));
        MY = MSEL.size ? mp([...MSEL][0])[0] : parts(todayISO())[0];
        return `
            <div class="card form" oninput="if(event.target.closest('#p_t,#p_s,#p_d,#p_p'))pCalc()">
                <h2>${L(p.id ? 'Edit Payment' : 'Register Payment')}</h2>
                <h3 class="sec">${L('Payment Details')}</h3>
                <div class="fg">
                    <div class="fld"><label>${L('Tenant')}</label><select id="p_t">${D.Tenants.map(t => `<option value="${t.id}" ${t.id == p.tenantId ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
                    ${field('p_m', 'Payment Method', p.method, '', ['Bank', 'Cash'])}
                    ${field('p_s', 'Status', p.status, '', ['Paid', 'Unpaid'])}
                    ${field('p_r', 'Receipt No.', p.receipt)}
                    ${field('p_c', 'CPV No.', p.cpv)}
                    ${dfield('p_d', L('Due Date'), p.dueDate)}
                    ${dfield('p_p', L('Date Paid'), p.date)}
                </div>
                <h3 class="sec">${L('Months Paid')}</h3>
                <div class="fg"><div class="fld"><label>${L(EC() ? 'Year (EC)' : 'Year')}</label><input type="number" id="m_y" value="${MY}" onchange="setMY(this.value)"></div></div>
                <div id="m_chips" class="chips">${monthChips()}</div>
                <p class="msum" id="m_sum">${msum()}</p>
                <div class="fg">
                    ${field('p_tot', 'Total Payment (Rent × Months)', p.total || '', 'number', null, 1)}
                    ${field('p_pen', 'Penalty (automatic)', p.penalty || 0, 'number', null, 1)}
                </div>
                <h3 class="sec">${L('Penalty Payment')}</h3>
                <div class="fg">
                    ${field('p_pp', 'Penalty Amount Paid', p.penaltyPaid || 0, 'number')}
                    ${field('p_pm', 'Penalty Payment Method', p.penaltyMethod, '', ['Bank', 'Cash'])}
                    ${field('p_pr', 'Penalty Receipt No.', p.penaltyReceipt)}
                </div>
                ${actions(`pSave('${p.id || ''}')`, p.id ? "clearEdit();SUB.tenants='plist';render()" : '', p.id ? canE('p') : canA('p'))}
            </div>`;
    }
    function pCalc() {
        const t = D.Tenants.find(x => x.id == val('p_t'));
        if (!t) return;
        const total = N(t.monthly) * MSEL.size;
        $('p_tot').value = total;
        $('p_pen').value = val('p_s') == 'Paid' ? Math.round(penaltyFor(total, dval('p_d'), dval('p_p')) * 100) / 100 : 0;
    }
    async function pSave(id) {
        const t = D.Tenants.find(x => x.id == val('p_t'));
        if (!t) return alert(L('Select a tenant'));
        if (!MSEL.size) return alert(L('Select at least one month'));
        if (val('p_s') == 'Paid' && !val('p_r')) return alert(L('Enter the payment receipt number'));
        if (N(val('p_pp')) > 0 && !val('p_pr')) return alert(L('Enter the receipt number for the penalty payment'));
        await run('saveRow', T, 'Payments', {
            id, tenantId: t.id, method: val('p_m'), status: val('p_s'), months: MSEL.size, monthList: [...MSEL].sort().join(','),
            receipt: val('p_r'), cpv: val('p_c'), dueDate: dval('p_d'), date: dval('p_p'), total: val('p_tot'), penalty: val('p_pen'),
            penaltyPaid: val('p_pp'), penaltyMethod: N(val('p_pp')) > 0 ? val('p_pm') : '', penaltyReceipt: val('p_pr')
        });
        clearEdit();
        if (id) SUB.tenants = 'plist';
        else toast('Payment registered');
        load();
    }

    // ---- Payments: list ----
    function vPayList() {
        const cols = [['tenant', 'Tenant'], ['gender', 'Gender', '', GEN], ['contract', 'Agreement', '', CON], ['method', 'Method', '', ['Bank', 'Cash']], ['status', 'Status', '', ['Paid', 'Unpaid']], ['monthsTxt', 'Months'], ['months', 'Count'], ['receipt', 'Receipt'], ['cpv', 'CPV'], ['dueDate', 'Due'], ['date', 'Paid On'], ['total', 'Total'], ['penalty', 'Penalty', 'bad'], ['penaltyPaid', 'Penalty Paid'], ['penaltyMethod', 'Penalty Method', '', ['Bank', 'Cash']], ['penaltyReceipt', 'Penalty Receipt']];
        const data = D.Payments.map(p => {
            const t = D.Tenants.find(x => x.id == p.tenantId) || {};
            const monthsTxt = (p.monthList || '').split(',').filter(Boolean).map(mlabel).join(', ');
            return { ...p, tenant: tn(p.tenantId), gender: t.gender, contract: t.contract, monthsTxt, dueDate: dt(p.dueDate), date: dt(p.date) };
        });
        const sum = (sh, k) => fmt(sh.reduce((a, r) => a + N(r[k]), 0));
        const foot = sh => `<tr><td colspan="11">${L('Sum')}</td><td>${sum(sh, 'total')}</td><td>${sum(sh, 'penalty')}</td><td>${sum(sh, 'penaltyPaid')}</td><td></td><td></td><td class="act"></td></tr>`;
        const act = canE('p') || canD('p') ? r => btns('p', r.id) : null;
        return `<div class="card">${bar('Payments List')}${tbl('pay', cols, data, act, foot)}</div>`;
    }

    // ---- Debts ----
    function vDebt() {
        const cols = [['name', 'Tenant'], ['gender', 'Gender', '', GEN], ['contract', 'Agreement', '', CON], ['owedM', 'Unpaid Months'], ['owedAmt', 'Monthly Debt'], ['prev', 'Prev. Debt Remaining'], ['total', 'Total Debt'], ['pen', 'Penalty', 'bad'], ['penPaid', 'Penalty Paid'], ['penLeft', 'Penalty Remaining', 'bad'], ['all', 'Grand Total']];
        const data = D.Tenants.map(t => {
            const d = debtOf(t);
            return { name: t.name, gender: t.gender, contract: t.contract, owedM: d.owedM, owedAmt: fmt(d.owedAmt), prev: fmt(d.prev), total: fmt(d.total), pen: fmt(d.pen), penPaid: fmt(d.penPaid), penLeft: fmt(d.penLeft), all: fmt(d.total + d.penLeft) };
        });
        return `<div class="card">${bar('Tenant Debts')}${tbl('debt', cols, data)}</div>`;
    }

    // ---- Report (quarterly by months, with summary and graphs) ----
    function qLabel(q) {
        const n = mnames();
        const a = (q - 1) * 3;
        return n[a] + ' – ' + n[q == 4 && EC() ? 12 : a + 2];
    }
    // horizontal bar chart: rows = [{l, v:[...]}], series = [[name, color], ...]
    function hbars(rows, series) {
        const max = Math.max(1, ...rows.flatMap(r => r.v));
        const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s[1]}"></i>${L(s[0])}</span>`).join('')}</div>` : '';
        const body = rows.map(r => `
            <div class="hb-row"><span class="hb-l">${L(r.l)}</span><div class="hb-bars">
                ${r.v.map((v, i) => `<div class="hb-line"><div class="hb-bar" style="width:${v ? Math.max(3, v / max * 100) : 0}%;background:${series[i][1]}"></div><span class="hb-v">${v}</span></div>`).join('')}
            </div></div>`).join('');
        return `<div class="hbc">${legend}${body}</div>`;
    }
    function vReport() {
        const C = S('calendar') || 'GC';
        if (F.yc != C) {
            F.yc = C;
            const tp = parts(todayISO());
            F.y = tp[0];
            F.q = Math.min(4, Math.floor((tp[1] - 1) / 3) + 1);
        }
        const m0 = (F.q - 1) * 3 + 1;
        const last = F.q == 4 && EC() ? 13 : m0 + 2;
        let aI;
        let bI;
        if (EC()) {
            aI = ecToGc(F.y, m0, 1);
            bI = addDays(F.q == 4 ? ecToGc(F.y + 1, 1, 1) : ecToGc(F.y, m0 + 3, 1), -1);
        } else {
            aI = `${F.y}-${pad(m0)}-01`;
            bI = iso(new Date(Date.UTC(F.y, m0 + 2, 0)));
        }
        const inQ = e => {
            const [y, m] = mp(e);
            return y == F.y && m >= m0 && m <= last;
        };
        const data = D.Tenants.map(t => {
            let pm = 0;
            let paid = 0;
            D.Payments.filter(p => p.tenantId == t.id && p.status == 'Paid').forEach(p => {
                if (p.monthList) {
                    const c = p.monthList.split(',').filter(inQ).length;
                    pm += c;
                    paid += N(p.months) ? N(p.total) / N(p.months) * c : 0;
                } else if (p.date >= aI && p.date <= bI) {
                    pm += N(p.months);
                    paid += N(p.total);
                }
            });
            const um = Math.max(0, 3 - pm);
            return { name: t.name, gender: t.gender, contract: t.contract, pm, paid: fmt(paid), um, unpaid: fmt(um * N(t.monthly)), _p: paid, _u: um * N(t.monthly) };
        });
        const cols = [['name', 'Name'], ['gender', 'Gender', '', GEN], ['contract', 'Agreement', '', CON], ['pm', 'Months Paid'], ['paid', 'Paid'], ['um', 'Months Unpaid'], ['unpaid', 'Unpaid', 'bad']];
        const sh = flt('report', cols, data);
        // summary by gender / agreement: a tenant counts as "paid" when no month is unpaid
        const grp = f => {
            const g = sh.filter(f);
            const paid = g.filter(r => r.um == 0).length;
            return { n: g.length, p: paid, u: g.length - paid, pa: g.reduce((s, r) => s + r._p, 0), ua: g.reduce((s, r) => s + r._u, 0) };
        };
        const defs = [['Male', r => r.gender == 'Male'], ['Female', r => r.gender == 'Female'], ['Other', r => r.gender == 'Other'], ['Contract', r => r.contract == 'Contract'], ['Non-contract', r => r.contract == 'Non-contract'], ['All Tenants', () => true]];
        const G = defs.map(d => [d[0], grp(d[1])]).filter(g => g[0] != 'Other' || g[1].n);
        const gRows = G.filter(g => g[0] != 'All Tenants');
        const all = G[G.length - 1][1];
        const qOpts = [1, 2, 3, 4].map(q => `<option value="${q}" ${F.q == q ? 'selected' : ''}>${qLabel(q)}</option>`).join('');
        const sumRows = G.map(g => `<tr class="${g[0] == 'All Tenants' ? 'tot' : ''}"><td>${L(g[0])}</td><td>${g[1].n}</td><td>${g[1].p}</td><td class="bad">${g[1].u}</td><td>${fmt(g[1].pa)}</td><td class="bad">${fmt(g[1].ua)}</td></tr>`).join('');
        return `
            <div class="card form">
                <h2>${L('Quarterly Report')}</h2>
                <div class="fg">
                    ${field('r_y', EC() ? 'Year (EC)' : 'Year', F.y, 'number')}
                    <div class="fld"><label>${L('Months')}</label><select onchange="F.q=+this.value;render()">${qOpts}</select></div>
                </div>
                <div class="actions"><button onclick="F.y=+val('r_y');render()">${L('Show')}</button></div>
            </div>
            <div class="card">
                ${bar(L('Report') + ': ' + qLabel(F.q) + ' ' + F.y)}
                <div class="grid">
                    <div class="kpi">${L('Total Tenants')}<b>${all.n}</b></div>
                    <div class="kpi">${L('Paid Amount')}<b>${fmt(all.pa)}</b></div>
                    <div class="kpi">${L('Unpaid Amount')}<b class="bad">${fmt(all.ua)}</b></div>
                </div>
                <h3 class="sec">${L('Summary')}</h3>
                <div class="wrap"><table class="sum">
                    <tr><th>${L('Group')}</th><th>${L('Total')}</th><th>${L('Paid tenants')}</th><th>${L('Unpaid tenants')}</th><th>${L('Paid Amount')}</th><th>${L('Unpaid Amount')}</th></tr>
                    ${sumRows}
                </table></div>
                <p class="hint">${L('Paid = no unpaid month in the selected months.')}</p>
                <div class="charts">
                    <div><h3 class="sec">${L('Tenants by Gender and Agreement')}</h3>${hbars(gRows.map(g => ({ l: g[0], v: [g[1].n] })), [['Tenants', '#2d8fe5']])}</div>
                    <div><h3 class="sec">${L('Paid vs Unpaid Tenants')}</h3>${hbars(gRows.map(g => ({ l: g[0], v: [g[1].p, g[1].u] })), [['Paid tenants', '#1b7f4b'], ['Unpaid tenants', '#c0392b']])}</div>
                </div>
                ${tbl('report', cols, data)}
            </div>`;
    }

    // ---- Users (Super Admin only): register + list ----
    const BASE_ROLES = ['Admin', 'Super Admin'];
    const roles = () => [...new Set([...BASE_ROLES, ...(S('roles') || '').split(',').map(x => x.trim()).filter(Boolean)])];
    function vUserForm() {
        const u = D.Users.find(x => x.id == EDIT.u) || {};
        return `
            <div class="card form">
                <h2>${L(u.id ? 'Edit User' : 'Register User')}</h2>
                <h3 class="sec">${L('Staff Information')}</h3>
                <div class="fg">
                    ${field('u_n', 'Full Name', u.name, 'text', null, 0, 'Full name')}
                    ${field('u_g', 'Gender', u.gender, '', GEN)}
                    ${field('u_r', 'Role', u.role || 'Admin', '', roles())}
                    ${field('u_e', 'Email (optional)', u.email, 'email', null, 0, 'name@example.com')}
                    ${u.code ? field('u_c', 'Code', u.code, 'text', null, 1) : ''}
                    ${field('u_p', u.id ? 'New Password (leave blank to keep)' : 'Password', u.id ? '' : '1234', u.id ? 'password' : 'text')}
                </div>
                ${u.id ? '' : `<p class="hint">${L('The code (ARDORS01, ARDORS02 …) is generated automatically. Default password is 1234 (minimum 4 characters).')}</p>`}
                ${actions(`uSave('${u.id || ''}')`, u.id ? "clearEdit();SUB.users='list';render()" : '')}
            </div>`;
    }
    async function uSave(id) {
        const pw = val('u_p');
        const em = val('u_e').trim();
        if (!val('u_n')) return alert(L('Enter a name'));
        if (pw && pw.length < 4) return alert(L('Password must be at least 4 characters'));
        if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return alert(L('Enter a valid email or leave it empty'));
        await run('saveRow', T, 'Users', { id, name: val('u_n'), gender: val('u_g'), role: val('u_r'), email: em, password: pw, perms: '' });
        clearEdit();
        if (id) SUB.users = 'list';
        else toast('User registered');
        load();
    }
    function vUserList() {
        const cols = [['name', 'Name'], ['gender', 'Gender', '', GEN], ['role', 'Role', '', roles()], ['code', 'Code'], ['email', 'Email'], ['status', 'Status', '', ['Active', 'Pending']]];
        const data = D.Users.map(u => ({ ...u, status: u.status || 'Active' }));
        const act = r => `<button class="s" onclick="editRec('u','${r.id}')">${L('Edit')}</button><button class="s d" onclick="rm('u','${r.id}')">${L('Del')}</button>`;
        return `<div class="card">${bar('Users List')}${tbl('users', cols, data, act)}</div>`;
    }

    // ---- Settings (Super Admin only): penalty, roles, role permissions ----
    const PTABS = [['tenants', 'Tenants'], ['reg', 'Register Tenant'], ['list', 'Tenants List'], ['preg', 'Register Payment'], ['plist', 'Payments List'], ['debt', 'Debts'], ['report', 'Report']];
    const PACTS = ['view', 'add', 'edit', 'delete'];
    const PL = { view: ['View', 'ማየት'], add: ['Add', 'መመዝገብ'], edit: ['Edit', 'ማስተካከል'], delete: ['Delete', 'መሰረዝ'] };
    let PROLE = '';
    const allPerms = () => {
        try { return JSON.parse(S('permissions') || '{}') || {}; } catch (e) { return {}; }
    };
    function vPermCard() {
        const rl = roles().filter(r => r != 'Super Admin');
        if (!rl.includes(PROLE)) PROLE = rl[0];
        const cur = allPerms()[PROLE] || {};
        const head = PACTS.map(a => `<th>${PL[a][LANG == 'am' ? 1 : 0]}</th>`).join('');
        const body = PTABS.map(t => {
            const boxes = PACTS.map(a => `<td><input type="checkbox" class="pk" data-tab="${t[0]}" data-a="${a}" ${(cur[t[0]] || '').split(',').includes(a) ? 'checked' : ''} onchange="permTick(this)"></td>`).join('');
            return `<tr><td class="ptab ${['tenants', 'report'].includes(t[0]) ? '' : 'psub'}">${L(t[1])}</td>${boxes}</tr>`;
        }).join('');
        return `
            <div class="card form">
                <h2>${L('Role Permissions')}</h2>
                <div class="fg"><div class="fld"><label>${L('Select Role')}</label><select onchange="PROLE=this.value;render()">${rl.map(r => `<option value="${esc(r)}" ${r == PROLE ? 'selected' : ''}>${esc(L(r))}</option>`).join('')}</select></div></div>
                <div class="wrap"><table class="perm-table"><tr><th>${L('Tab')}</th>${head}</tr>${body}</table></div>
                <p class="hint">${L('Tick View to show a tab. Add / Edit / Delete need View. A tab with nothing ticked stays hidden. Super Admin always has full access.')}</p>
                ${actions('permSave()')}
            </div>`;
    }
    function permTick(el) {
        const q = (t, a) => document.querySelector(`.pk[data-tab="${t}"][data-a="${a}"]`);
        const tab = el.dataset.tab;
        const a = el.dataset.a;
        if (el.checked) {
            q(tab, 'view').checked = true;
            if (!['tenants', 'report'].includes(tab)) q('tenants', 'view').checked = true;
        } else if (a == 'view') {
            PACTS.forEach(x => { q(tab, x).checked = false; });
            if (tab == 'tenants') PTABS.forEach(t => PACTS.forEach(x => { q(t[0], x).checked = false; }));
        }
    }
    async function permSave() {
        const o = {};
        PTABS.forEach(t => {
            const s = PACTS.filter(a => document.querySelector(`.pk[data-tab="${t[0]}"][data-a="${a}"]`).checked);
            if (s.length) o[t[0]] = s.join(',');
        });
        const all = allPerms();
        all[PROLE] = o;
        await run('saveRow', T, 'Settings', { key: 'permissions', value: JSON.stringify(all) });
        toast('Permissions saved');
        load();
    }
    function vSet() {
        const chips = roles().map(r => `<span class="rchip">${esc(L(r))}${BASE_ROLES.includes(r) ? '' : `<a onclick="rmRole('${esc(r)}')">×</a>`}</span>`).join('');
        return `
            <div class="card form">
                <h2>${L('Penalty Settings')}</h2>
                <div class="fg">
                    ${field('s_c', 'Calendar', S('calendar') || 'GC', '', ['GC', 'EC'])}
                    ${field('s_t', 'Penalty Type', S('penaltyType'), '', ['percent', 'fixed'])}
                    ${field('s_v', 'Value (% or number)', S('penaltyValue'), 'number')}
                    ${field('s_g', 'Grace days', S('graceDays'), 'number')}
                </div>
                <p class="hint">${L('Calendar: GC = Gregorian · EC = Ethiopian (only the dates change)')}<br>${L('percent: total × % × days late | fixed: one-time fixed amount')}</p>
                ${actions('sSave()')}
            </div>
            <div class="card form">
                <h2>${L('User Roles')}</h2>
                <div class="chips">${chips}</div>
                <div class="fg">${field('s_role', 'Add New Role', '', 'text', null, 0, 'e.g. Accountant')}</div>
                <div class="actions"><button onclick="addRole()">+ ${L('Add Role')}</button></div>
            </div>
            ${vPermCard()}`;
    }
    async function sSave() {
        await run('saveRow', T, 'Settings', { key: 'calendar', value: val('s_c') });
        await run('saveRow', T, 'Settings', { key: 'penaltyType', value: val('s_t') });
        await run('saveRow', T, 'Settings', { key: 'penaltyValue', value: val('s_v') });
        await run('saveRow', T, 'Settings', { key: 'graceDays', value: val('s_g') });
        toast('Settings saved');
        load();
    }
    async function addRole() {
        const r = val('s_role').replace(/[<>"',]/g, '').trim();
        if (!r) return alert(L('Enter a role name'));
        if (roles().some(x => x.toLowerCase() == r.toLowerCase())) return alert(L('This role already exists'));
        await run('saveRow', T, 'Settings', { key: 'roles', value: [...roles().filter(x => !BASE_ROLES.includes(x)), r].join(',') });
        toast('Role added');
        load();
    }
    async function rmRole(r) {
        if ((D.Users || []).some(u => u.role == r)) return alert(L('This role is used by a user and cannot be removed'));
        if (!confirm(L('Remove role') + ' "' + r + '"?')) return;
        await run('saveRow', T, 'Settings', { key: 'roles', value: roles().filter(x => !BASE_ROLES.includes(x) && x != r).join(',') });
        load();
    }

    // ---- Login page: Create account / Forgot password (open instantly, no loading) ----
    let PR = BASE_ROLES;
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'getRoles', args: [] }) })
        .then(r => r.json())
        .then(r => {
            if (r.ok && Array.isArray(r.data)) {
                PR = r.data;
                if ($('c_r')) $('c_r').innerHTML = PR.map(x => `<option value="${esc(x)}">${esc(L(x))}</option>`).join('');
            }
        })
        .catch(() => { });
    const lpbox = (h, v) => {
        LPV = v;
        $('lg').classList.add('hide');
        $('lp').innerHTML = h;
    };
    function lpBack() {
        LPV = '';
        $('lp').innerHTML = '';
        $('lg').classList.remove('hide');
        $('lm').textContent = '';
    }
    const msg2 = (t, ok) => {
        const e = $('lm2');
        e.style.color = ok ? 'var(--g2)' : '';
        e.textContent = L(t);
    };
    function lpCreate() {
        lpbox(`<h2>${L('Create account')}</h2><label>${L('Role')}</label><select id="c_r">${PR.map(r => `<option value="${esc(r)}">${esc(L(r))}</option>`).join('')}</select>
            <input id="c_c" placeholder="${L('Code (ARDORS01)')}"><input id="c_e" type="email" placeholder="${L('Email (optional)')}"><input id="c_p" type="password" placeholder="${L('Password (min 4)')}"><input id="c_p2" type="password" placeholder="${L('Confirm password')}">
            <button onclick="doCreate()">${L('Create account')}</button><button class="xbtn" style="width:100%" onclick="lpBack()">${L('← Back')}</button><p id="lm2" class="bad"></p>`, 'create');
    }
    async function doCreate() {
        if ($('c_p').value != $('c_p2').value) return msg2('Passwords do not match');
        const r = await run('createAccount', $('c_r').value, $('c_c').value, $('c_e').value, $('c_p').value);
        if (!r.ok) return msg2(r.msg);
        const c = $('c_c').value.trim().toUpperCase();
        lpBack();
        $('u').value = c;
        $('lm').style.color = 'var(--g2)';
        $('lm').textContent = L('Your account has been created. Log in with your Code and Password.');
    }
    function lpForgot() {
        lpbox(`<h2>${L('Forgot password')}</h2><input id="f_c" placeholder="${L('Code (ARDORS01)')}"><input id="f_e" type="email" placeholder="${L('Registered email')}">
            <button onclick="doFSend()">${L('Send code to my email')}</button>
            <div id="f2" class="hide"><input id="f_o" placeholder="${L('Verification code (6 digits)')}"><input id="f_p" type="password" placeholder="${L('New password (min 4)')}"><input id="f_p2" type="password" placeholder="${L('Confirm new password')}"><button onclick="doFReset()">${L('Reset password')}</button></div>
            <button class="xbtn" style="width:100%" onclick="lpBack()">${L('← Back')}</button><p id="lm2" class="bad"></p>`, 'forgot');
    }
    async function doFSend() {
        await run('forgotRequest', $('f_c').value, $('f_e').value);
        $('f2').classList.remove('hide');
        msg2('If the code and email are correct, a verification code has been sent to your email (check Spam too).', 1);
    }
    async function doFReset() {
        if ($('f_p').value != $('f_p2').value) return msg2('Passwords do not match');
        const r = await run('forgotReset', $('f_c').value, $('f_o').value, $('f_p').value);
        if (!r.ok) return msg2(r.msg);
        const c = $('f_c').value.trim().toUpperCase();
        lpBack();
        $('u').value = c;
        $('lm').style.color = 'var(--g2)';
        $('lm').textContent = L('Password has been changed. Log in now.');
    }
    applyLang();

    </script>
</body>

</html>
